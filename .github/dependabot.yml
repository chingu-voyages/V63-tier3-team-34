version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /client
      - /server
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories:
      - /client
      - /server
    schedule:
      interval: weekly
