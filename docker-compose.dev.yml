# Development overrides: hot reload with source bind-mounted into the containers.
# Used via the Makefile (make dev / dev-fe / dev-be), or directly:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# node_modules live in named volumes so the container's Linux install never
# collides with the macOS/Windows install on your host.

services:
  server:
    build: !reset null
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      NODE_ENV: development
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:5173}
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules

  client:
    build: !reset null
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_PROXY: http://server:3000
    ports: !override
      - '${CLIENT_DEV_PORT:-5173}:5173'
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules

volumes:
  server_node_modules:
  client_node_modules:
